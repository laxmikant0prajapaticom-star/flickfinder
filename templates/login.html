
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickFinder - Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080808;
            color: white;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: #171717;
            border-radius: 12px;
            border: 1px solid #333;
        }

        h1 {
            color: #ff2525;
            text-align: center;
        }

        p {
            color: #aaa;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #ff3333;
            text-decoration: none;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .flash {
            margin: 12px 0;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .flash[hidden] {
            display: none;
        }

        .flash.error {
            color: #ffd5d5;
            background: #5a1d1d;
        }

        .flash.success {
            color: #d7ffe0;
            background: #1d4b2b;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>FlickFinder</h1>
        <p>Welcome Back!</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="flash {{ category }}" role="status">{{ message }}</p>
        {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="email" name="email"
                   placeholder="Email Address" autocomplete="email"
                   value="{{ email or '' }}" required>

            <input type="password" name="password"
                   placeholder="Password" autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </div>

        <div class="register-link">
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>
    </div>
</body>
</html>
