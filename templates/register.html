
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickFinder - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080808;
            color: white;
        }

        .register-box {
            width: 380px;
            padding: 35px;
            background: #171717;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #ff2525;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: red;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b20710;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            color: #aaa;
        }

        a {
            color: #ff3333;
            text-decoration: none;
        }

        .flash {
            margin: 12px 0;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .flash[hidden] {
            display: none;
        }

        .flash.error {
            color: #ffd5d5;
            background: #5a1d1d;
        }

        .flash.success {
            color: #d7ffe0;
            background: #1d4b2b;
        }
    </style>
</head>

<body>

    <div class="register-box">
        <h1>FlickFinder</h1>
        <p>Create your account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="flash {{ category }}" role="status">{{ message }}</p>
        {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <input type="text" name="name" placeholder="Full Name"
                   autocomplete="name" value="{{ name or '' }}" required>
            <input type="email" name="email" placeholder="Email Address"
                   autocomplete="email" value="{{ email or '' }}" required>
            <input type="password" name="password" placeholder="Password"
                   autocomplete="new-password" minlength="8" required>
            <input type="password" name="confirm_password"
                   placeholder="Confirm Password"
                   autocomplete="new-password" minlength="8" required>
            <button type="submit">Register</button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

        <div class="login-link">
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>
    </div>
</body>
</html>
